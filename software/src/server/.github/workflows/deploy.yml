name: Deploy to Proxmox

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /opt/sdp
          git pull origin main

      - name: Write environment file  # NEW
        run: |
          cd /opt/sdp
          cat > .env << EOF
          VAR_NAME_1=${{ secrets.VAR_NAME_1 }}
          VAR_NAME_2=${{ secrets.VAR_NAME_2 }}
          EOF

      - name: Build and deploy
        run: |
          cd /opt/sdp
          docker compose down
          docker compose up -d --build

      - name: Show status
        run: |
          cd /opt/sdp
          docker compose ps
          docker compose logs --tail=30