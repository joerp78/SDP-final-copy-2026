<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Employees — Payroll</title>
    <style>
        body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:20px;background:#f6f8fb}
        .wrap{max-width:900px;margin:0 auto}
        form{display:flex;gap:8px;margin-bottom:12px}
        input{padding:8px;border:1px solid #ddd;border-radius:4px}
        button{padding:8px 12px;background:#2563eb;color:#fff;border:0;border-radius:6px}
        table{width:100%;border-collapse:collapse;background:#fff;border-radius:6px;overflow:hidden}
        th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}
        .muted{color:#666;font-size:0.9rem}
        .actions form{display:inline}
    </style>
</head>
<body>
<div class="wrap">
    <h1>Employees</h1>

    <section>
        <h2>Add employee</h2>
        <form th:action="@{/employees}" th:object="${employeeForm}" method="post">
            <!-- Render CSRF only if present (works without Spring Security too) -->
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="text" th:field="*{name}" placeholder="Name" required />
            <input type="text" th:field="*{role}" placeholder="Role" required />
            <button type="submit">Create</button>
        </form>
    </section>

    <section>
        <h2>All employees</h2>
        <table>
            <thead><tr><th>ID</th><th>Name</th><th>Role</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.id}">1</td>
                <td th:text="${emp.name}">Name</td>
                <td th:text="${emp.role}">Role</td>
                <td class="actions">
                    <a th:href="@{|/employees/${emp.id}|}">View</a>
                    <!-- Delete via POST form; CSRF included only if present -->
                    <form th:action="@{|/employees/${emp.id}/delete|}" method="post" style="display:inline">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${employees == null or #lists.isEmpty(employees)}">
                <td colspan="4" class="muted">No employees</td>
            </tr>
            </tbody>
        </table>
    </section>
</div>
</body>
</html>
