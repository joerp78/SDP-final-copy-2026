<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="'BLOSSM — ' + ${plant.name}">BLOSSM — Plant Detail</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --bg: #f0f4f1;      --card: #ffffff;
        --primary: #2d6a4f; --primary-dark: #1b4332;
        --primary-light: #40916c;
        --accent-light: #d8f3dc;
        --text: #1b4332;    --text-secondary: #52796f;
        --text-muted: #8faba1; --border: #d8e4dd;
        --temp: #e07a5f;    --moisture: #457b9d;
        --healthy: #40916c; --warning: #e9a820; --critical: #d64045;
        --shadow: 0 2px 12px rgba(27,67,50,0.08);
        --shadow-lg: 0 8px 30px rgba(27,67,50,0.12);
        --radius: 16px;     --radius-sm: 10px;
    }

    body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
    }

    /* ─── Banner (compact) ─── */
    .banner {
        background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 40%, #40916c 100%);
        color: #fff;
        padding: 18px 32px;
        box-shadow: 0 4px 24px rgba(27,67,50,0.25);
    }
    .banner-inner {
        max-width: 1280px; margin: 0 auto;
        display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    }
    .back-btn {
        display: inline-flex; align-items: center; gap: 6px;
        color: rgba(255,255,255,0.85); text-decoration: none;
        font-size: 0.85rem; font-weight: 600;
        padding: 6px 14px; border-radius: 50px;
        border: 1px solid rgba(255,255,255,0.25);
        transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.15); }
    .banner-plant-name { font-size: 1.4rem; font-weight: 800; }
    .banner-status {
        font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.5px; padding: 4px 14px; border-radius: 50px;
    }
    .banner-status.healthy  { background: rgba(149,213,178,0.3); }
    .banner-status.warning  { background: rgba(233,168,32,0.3); }
    .banner-status.critical { background: rgba(214,64,69,0.3); }

    .container {
        max-width: 1280px; margin: 0 auto;
        padding: 28px 24px 60px;
    }

    /* ─── Big Metric Cards ─── */
    .metric-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px; margin-bottom: 32px;
    }
    .metric-card {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 24px;
        display: flex; align-items: flex-start; gap: 16px;
        border-top: 4px solid var(--border);
    }
    .metric-card.temp         { border-top-color: var(--temp); }
    .metric-card.moisture     { border-top-color: var(--moisture); }
    .mc-icon {
        width: 48px; height: 48px; border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
    }
    .metric-card.battery     { border-top-color: var(--battery); }
    .mc-icon svg { width: 22px; height: 22px; }
    .mc-icon.temp         { background: #fce8e2; color: var(--temp); }
    .mc-icon.moisture     { background: #dfeef7; color: var(--moisture); }
    .mc-icon.battery         { background: #d8f3dc; color: var(--battery); }
    .mc-info .mc-value {
        font-size: 2rem; font-weight: 800; line-height: 1.2;
    }
    .mc-info .mc-label {
        font-size: 0.82rem; color: var(--text-muted); margin-top: 2px;
    }

    /* ─── Full Charts ─── */
    .chart-section {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 28px;
        margin-bottom: 24px;
    }
    .chart-section h3 {
        font-size: 1rem; font-weight: 700;
        margin-bottom: 16px;
        display: flex; align-items: center; gap: 8px;
    }
    .chart-section h3 .dot {
        width: 12px; height: 12px; border-radius: 50%;
        display: inline-block;
    }
    .chart-full { position: relative; height: 280px; }

    @media (max-width: 768px) {
        .banner { padding: 14px 18px; }
        .container { padding: 18px 14px 40px; }
        .metric-cards { grid-template-columns: 1fr; }
        .chart-full { height: 220px; }
    }
  </style>
</head>
<body>

<!-- ─── Banner ─── -->
<header class="banner">
  <div class="banner-inner">
    <a href="/sdp" class="back-btn">← Dashboard</a>
    <span class="banner-plant-name" th:text="${plant.name}">Plant 1</span>
    <span class="banner-status"
          th:classappend="${plant.status}"
          th:text="${plant.status}">Healthy</span>
  </div>
</header>

<main class="container">

  <!-- ─── Current Readings ─── -->
  <section class="metric-cards">
    <div class="metric-card temp">
      <div class="mc-icon temp">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M14 14.76V3.5a2 2 0 1 0-4 0v11.26a4.5 4.5 0 1 0 4 0z"/>
        </svg>
      </div>
      <div class="mc-info">
        <div class="mc-value"
             th:text="${plant.temperature != null
                               ? #numbers.formatDecimal(plant.temperature,1,1) + '°C'
                               : '—'}">22.5°C</div>
        <div class="mc-label">Temperature</div>
      </div>
    </div>
    <div class="metric-card moisture">
      <div class="mc-icon moisture">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0L12 2.69z"/>
        </svg>
      </div>
      <div class="mc-info">
        <div class="mc-value"
             th:text="${plant.soilMoisture != null
                               ? #numbers.formatDecimal(plant.soilMoisture,1,1) + '%'
                               : '—'}">45.0%</div>
        <div class="mc-label">Soil Moisture</div>
      </div>
    </div>
    <div class="metric-card battery">
      <div class="mc-icon battery">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/>
        </svg>
      </div>
      <div class="mc-info">
        <div class="mc-value"
             th:text="${plant.battery != null
                         ? #numbers.formatDecimal(plant.battery,1,1) + '%'
                         : '—'}">85.0%</div>
        <div class="mc-label">Battery</div>
      </div>
    </div>
  </section>

  <!-- ─── Temperature Chart ─── -->
  <section class="chart-section">
    <h3><span class="dot" style="background:#e07a5f"></span> Temperature Over Time</h3>
    <div class="chart-full"><canvas id="tempChart"></canvas></div>
  </section>

  <!-- ─── Soil Moisture Chart ─── -->
  <section class="chart-section">
    <h3><span class="dot" style="background:#457b9d"></span> Soil Moisture Over Time</h3>
    <div class="chart-full"><canvas id="moistureChart"></canvas></div>
  </section>

  <section class="chart-section">
    <h3><span class="dot" style="background:#74c69d"></span> Battery Over Time</h3>
    <div class="chart-full"><canvas id="batteryChart"></canvas></div>
  </section>

</main>

<script th:inline="javascript">
  /*
   * readingsJson shape (from backend):
   * {
   *   "labels":           ["Mon 08:00","Mon 08:05", ...],
   *   "temperature":      [22.5, 23.0, ...],
   *   "soilMoisture":     [45.0, 46.2, ...]
   * }
   */
  const readings = JSON.parse(/*[[${readingsJson}]]*/ '{}');

  function buildChart(id, labels, data, color, label, unit) {
      const ctx = document.getElementById(id).getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 280);
      grad.addColorStop(0, color + '35');
      grad.addColorStop(1, color + '05');

      new Chart(ctx, {
          type: 'line',
          data: {
              labels: labels,
              datasets: [{
                  label: label, data: data,
                  borderColor: color, backgroundColor: grad,
                  fill: true, tension: 0.35,
                  pointRadius: 2, pointHoverRadius: 6, borderWidth: 2.5
              }]
          },
          options: {
              responsive: true, maintainAspectRatio: false,
              interaction: { intersect: false, mode: 'index' },
              plugins: {
                  legend: { display: false },
                  tooltip: {
                      backgroundColor: '#1b4332', cornerRadius: 8,
                      padding: 10, titleFont: { size: 12 },
                      bodyFont: { size: 14, weight: '600' },
                      callbacks: {
                          label: function(t) { return t.parsed.y + ' ' + unit; }
                      }
                  }
              },
              scales: {
                  x: { grid: { display: false },
                       ticks: { color: '#8faba1', font: { size: 11 }, maxTicksLimit: 10 }},
                  y: { grid: { color: '#e8eeea' },
                       ticks: { color: '#8faba1', font: { size: 11 }}}
              }
          }
      });
  }

  if (readings && readings.labels) {
      buildChart('tempChart',         readings.labels, readings.temperature,
                 '#e07a5f', 'Temperature',  '°C');
      buildChart('moistureChart',     readings.labels, readings.soilMoisture,
                 '#457b9d', 'Soil Moisture', '%');
      buildChart('batteryChart',      readings.labels, readings.battery,
                  '#74c69d', 'Battery',        '%');
  }
</script>
</body>
</html>
