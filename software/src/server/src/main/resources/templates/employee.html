<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title th:text="'Employee ' + ${employee.id}">Employee</title>
    <style>body{font-family:system-ui;margin:20px}</style>
</head>
<body>
<a href="/" style="margin-bottom:12px;display:inline-block">&larr; Back</a>
<h1 th:text="${employee.name}">Name</h1>
<p><strong>ID:</strong> <span th:text="${employee.id}">1</span></p>
<p><strong>Role:</strong> <span th:text="${employee.role}">role</span></p>

<form th:action="@{|/employees/${employee.id}/delete|}" method="post">
    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <button type="submit">Delete</button>
</form>
</body>
</html>
