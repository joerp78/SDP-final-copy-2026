# ===== Local Development Configuration =====

# Server port (default is 8080)
server.port=8081

# Use embedded H2 database instead of remote DB
spring.datasource.url=jdbc:h2:mem:rfiddb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 web console for debugging (visit http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Let Hibernate auto-create tables from your entities
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Thymeleaf hot-reload during development
spring.thymeleaf.cache=false